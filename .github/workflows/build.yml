name: Build Astra VPN APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: astra-vpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Rename APK with run number
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/AstraVPN-debug-${{ github.run_number }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Astra VPN build ${{ github.run_number }}"
          files: dist/*.apk
          make_latest: true
