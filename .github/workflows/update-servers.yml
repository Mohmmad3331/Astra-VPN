name: Update server list

# GitHub's runners can reach vpngate.net even when it is filtered for the
# user. The latest public list is published to the `data` branch so the app
# can read it from GitHub / jsDelivr instead of the blocked host.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch VPN Gate list
        run: |
          set -e
          mkdir out && cd out
          for i in 1 2 3; do
            curl -fsSL --max-time 90 -A "Mozilla/5.0" http://www.vpngate.net/api/iphone/ -o servers.csv && break || sleep 10
          done
          lines=$(wc -l < servers.csv)
          echo "lines=$lines"
          test "$lines" -gt 20
          date -u +%FT%TZ > updated.txt

      - name: Publish to data branch (single force-pushed commit, no history bloat)
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servers.csv updated.txt
          git commit -q -m "Server list $(cat updated.txt)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -q --force origin data
